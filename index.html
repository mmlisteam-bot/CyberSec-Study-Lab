<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="دفتر درختی جزوه‌های پنتست وب، همگام با Obsidian و GitHub" />
    <title>دفتر پنتست وب</title>
    <link rel="stylesheet" href="assets/notebook.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="context" id="contextPanel" aria-label="سرفصل‌ها و پیوندها"><div class="context-sticky"><section class="context-section"><h2>در این یادداشت</h2><nav id="outline" class="outline"></nav></section><section class="context-section"><h2>بک‌لینک‌ها</h2><div id="backlinks"></div></section></div></aside>
      <main class="reader">
        <header class="topbar">
          <button class="icon-btn mobile-only" id="treeOpen" aria-label="باز کردن درخت"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button>
          <div class="note-location"><strong id="noteName">دفتر پنتست وب</strong><span id="notePath">obsidian/00-Start/Home.md</span></div>
          <div class="top-actions">
            <button class="icon-btn" id="searchOpen" aria-label="جست‌وجو" title="جست‌وجو (Ctrl K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg></button>
            <button class="icon-btn" id="printNote" aria-label="چاپ یادداشت" title="چاپ"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4V9h16v9h-2M6 14h12v7H6Z" /></svg></button>
            <button class="icon-btn" id="themeToggle" aria-label="تغییر پوسته" title="تغییر پوسته"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M20 15.5A8 8 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z" /></svg></button>
            <a class="text-btn" id="editOnGithub" href="https://github.com/mmlisteam-bot/CyberSec-Study-Lab" target="_blank" rel="noopener noreferrer">ویرایش در GitHub<svg viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3M21 14v7H3V3h7" /></svg></a>
          </div>
        </header>
        <div class="reading-progress" id="readingProgress"></div>
        <article class="paper" id="paper"><div class="binder" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="loading" id="loading"><span></span><p>در حال باز کردن دفتر…</p></div><div class="markdown" id="markdown" hidden></div><div class="note-footer" id="noteFooter" hidden><span>ذخیره‌شده در GitHub</span><button id="copyLink">کپی پیوند یادداشت</button></div></article>
      </main>
      <aside class="sidebar" id="sidebar" aria-label="درخت جزوه‌ها">
        <div class="brand"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M9 5h19a3 3 0 0 1 3 3v27H12a5 5 0 0 1-5-5V8a3 3 0 0 1 2-3Z" /><path d="M12 5v30M17 13h8M17 19h8" /></svg><div><strong>دفتر</strong><span>WEB PENTEST NOTES</span></div><button class="icon-btn mobile-only" id="treeClose" aria-label="بستن درخت"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button></div>
        <div class="sidebar-tools"><label class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg><input id="searchInput" type="search" placeholder="جست‌وجو در دفتر…" autocomplete="off" /><kbd>Ctrl K</kbd></label><div class="tree-meta"><span id="noteCount">یادداشت‌ها</span><button id="refreshTree" title="دریافت فهرست تازه"><svg viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M6.1 9a7 7 0 0 1 11.5-2.6L20 11M4 13l2.4 4.6A7 7 0 0 0 17.9 15" /></svg><span>همگام‌سازی</span></button></div></div>
        <nav class="tree" id="tree" aria-label="فایل‌ها"></nav><div class="search-results" id="searchResults" hidden></div>
        <footer class="sidebar-footer"><span class="sync-dot"></span><span>Obsidian + GitHub</span><a href="study-lab.html">آزمایشگاه قبلی</a></footer>
      </aside>
    </div>
    <div class="backdrop" id="backdrop"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript><div class="noscript">برای خواندن دفتر آنلاین، JavaScript را فعال کنید. فایل‌ها در <a href="https://github.com/mmlisteam-bot/CyberSec-Study-Lab/tree/main/obsidian">GitHub</a> نیز قابل خواندن هستند.</div></noscript>
    <script src="assets/notebook.js"></script>
  </body>
</html>
